<title>FitTrack Desktop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: iOS-style grouped cards. Sidebar navigation on desktop, bottom tab bar on phones.
   Colours mirror the app's Theme.swift (green calories, blue/orange/purple macros). */
:root {
  --bg: #f2f2f7;
  --card: #ffffff;
  --fg: #1c1c1e;
  --muted: #6c6c72;
  --line: #e3e3e8;
  --fill: #ececf1;
  --green: #28a745;
  --green-soft: rgba(52, 199, 89, .18);
  --orange: #e8860c;
  --blue: #0a6cf0;
  --purple: #a54bd6;
  --indigo: #5856d6;
  --danger: #d92d20;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.05);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Inter", "Segoe UI", sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --card: #1c1c1e; --fg: #f2f2f7; --muted: #9a9aa1; --line: #2e2e33; --fill: #2c2c30;
    --green: #30d158; --green-soft: rgba(48, 209, 88, .2); --orange: #ff9f0a; --blue: #2f8cff;
    --purple: #c56cf0; --indigo: #7d7aff; --danger: #ff5a4f;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --card: #1c1c1e; --fg: #f2f2f7; --muted: #9a9aa1; --line: #2e2e33; --fill: #2c2c30;
  --green: #30d158; --green-soft: rgba(48, 209, 88, .2); --orange: #ff9f0a; --blue: #2f8cff;
  --purple: #c56cf0; --indigo: #7d7aff; --danger: #ff5a4f;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.4; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
h1, h2, h3 { margin: 0; text-wrap: balance; }

.shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; padding: 24px 14px; border-right: 1px solid var(--line); background: var(--card); display: flex; flex-direction: column; gap: 4px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 10px 18px; font-weight: 700; font-size: 18px; }
.brand svg { width: 30px; height: 30px; border-radius: 8px; }
.nav { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 0; border-radius: 9px; background: none; text-align: left; font-weight: 500; }
.nav svg { width: 20px; height: 20px; color: var(--muted); }
.nav[aria-current="page"] { background: var(--fill); }
.nav[aria-current="page"] svg { color: var(--green); }
.side-note { margin-top: auto; padding: 10px; font-size: 12px; color: var(--muted); }

main { padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 12px; background: var(--fill); font-size: 13px; color: var(--muted); }
.banner svg { flex: none; width: 18px; height: 18px; margin-top: 1px; color: var(--orange); }
.topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.topbar h1 { font-family: var(--font-display); font-size: 32px; font-weight: 700; letter-spacing: -.01em; margin-right: auto; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 14px; border-radius: 999px; border: 0; background: var(--fill); font-weight: 600; font-size: 14px; }
.btn.primary { background: var(--green); color: #fff; }
.btn.danger { color: var(--danger); }
.btn.icon { width: 34px; height: 34px; padding: 0; }
.btn:disabled { opacity: .4; cursor: default; }
.btn svg { width: 16px; height: 16px; }
.seg { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--fill); }
.seg button { border: 0; background: none; padding: 5px 16px; border-radius: 7px; font-weight: 600; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; min-width: 0; }
.card h2 { font-size: 17px; font-weight: 600; }
.card .sub { font-size: 14px; color: var(--muted); margin-top: 2px; }
.section-label { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); padding: 0 4px; }

/* Today */
.today { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 18px; align-items: start; }
.summary { display: flex; flex-direction: column; gap: 22px; }
.summary-top { display: flex; align-items: center; gap: 20px; }
.ring { position: relative; width: 150px; height: 150px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring-label b { font-family: var(--font-display); font-size: 28px; font-weight: 700; }
.ring-label span { font-size: 12px; color: var(--muted); }
.ring-label span.over { color: var(--orange); }
.stats { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.stat { display: flex; gap: 10px; align-items: center; }
.stat svg { width: 18px; height: 18px; flex: none; }
.stat small { display: block; font-size: 12px; color: var(--muted); }
.stat b { font-size: 15px; font-weight: 600; }
.gauges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.gauge svg { width: 58px; height: 58px; }
.gauge .t { font-size: 12px; font-weight: 600; margin-top: 4px; }
.gauge .v { font-size: 11px; color: var(--muted); }
.meals { display: flex; flex-direction: column; gap: 12px; }
.meal { padding: 0; overflow: hidden; }
.meal-head { display: flex; align-items: center; gap: 10px; width: 100%; padding: 14px 18px; border: 0; background: none; text-align: left; }
.meal-head svg.mi { width: 20px; height: 20px; flex: none; }
.meal-head h3 { font-size: 16px; font-weight: 600; margin-right: auto; }
.meal-head .chev { width: 14px; height: 14px; color: var(--muted); transition: transform .2s; }
.meal[data-open="false"] .chev { transform: rotate(-90deg); }
.meal[data-open="false"] .rows { display: none; }
.rows { border-top: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 18px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--fill); }
.row .src { width: 18px; height: 18px; flex: none; color: var(--muted); }
.row .name { flex: 1; min-width: 0; }
.row .name div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .name small { font-size: 12px; color: var(--muted); }
.row .kcal { text-align: right; flex: none; }
.row .kcal b { font-size: 14px; font-weight: 600; display: block; }
.macros-inline { font-size: 12px; color: var(--muted); display: inline-flex; gap: 8px; }
.macros-inline i { font-style: normal; font-weight: 700; }
.empty-row { padding: 12px 18px; font-size: 14px; color: var(--muted); }

.fab-wrap { position: fixed; right: calc(24px + env(safe-area-inset-right, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 20; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.fab { width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--green); color: #fff; box-shadow: 0 6px 18px rgba(0,0,0,.22); display: grid; place-items: center; }
.fab svg { width: 26px; height: 26px; transition: transform .2s; }
.fab[aria-expanded="true"] svg { transform: rotate(45deg); }
.menu { background: var(--card); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.2); padding: 6px; min-width: 240px; border: 1px solid var(--line); }
.menu button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border: 0; background: none; border-radius: 9px; text-align: left; }
.menu button:hover:not(:disabled) { background: var(--fill); }
.menu button:disabled { cursor: not-allowed; }
.menu button:disabled .lbl { color: var(--muted); }
.menu svg { width: 20px; height: 20px; color: var(--blue); flex: none; }
.menu button:disabled svg { color: var(--muted); }
.menu small { display: block; font-size: 11px; color: var(--muted); }

/* Progress */
.prog { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.prog .wide { grid-column: 1 / -1; }
.chart { position: relative; margin-top: 14px; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.tip { position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--line); box-shadow: 0 4px 14px rgba(0,0,0,.14); border-radius: 9px; padding: 7px 10px; font-size: 12px; white-space: nowrap; }
.tip b { font-size: 13px; display: block; }
.tiles { display: flex; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
.tile { flex: 1; min-width: 110px; }
.tile small { display: block; font-size: 12px; color: var(--muted); }
.tile b { font-size: 15px; font-weight: 600; }
.mbars { display: flex; flex-direction: column; gap: 14px; margin-top: 16px; }
.mbar { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13px; }
.mbar .track { position: relative; height: 20px; }
.mbar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; }
.mbar .tick { position: absolute; top: -3px; bottom: -3px; width: 3px; border-radius: 2px; background: var(--fg); opacity: .55; }
.mbar .val { color: var(--muted); font-size: 12px; }

/* Settings + forms */
.settings { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; }
.group { display: flex; flex-direction: column; gap: 6px; }
.list { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.li { display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 8px 16px; border-bottom: 1px solid var(--line); }
.li:last-child { border-bottom: 0; }
.li label, .li .lab { flex: 1; min-width: 0; }
.li input[type="number"], .li input[type="text"], .li input[type="date"], .li input[type="datetime-local"], .li select {
  width: 140px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); text-align: right; }
.li input[type="text"] { width: 200px; text-align: left; }
.li .unit { width: 34px; color: var(--muted); font-size: 14px; }
.li button.link { border: 0; background: none; color: var(--blue); padding: 0; font-weight: 500; }
.li button.link.danger { color: var(--danger); }
.foot { font-size: 12px; color: var(--muted); padding: 0 4px; }
.foot.warn { color: var(--orange); }
.choices { display: flex; flex-direction: column; }
.choice { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; width: 100%; }
.choice:last-child { border-bottom: 0; }
.choice small { display: block; color: var(--muted); font-size: 12px; }
.choice .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); flex: none; }
.choice[aria-pressed="true"] .dot { border: 5px solid var(--green); }
.plan { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 14px 16px; }
.plan small { display: block; font-size: 12px; color: var(--muted); }
.plan b { font-size: 17px; }

/* Modal */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; padding: 16px; }
.sheet { width: 100%; max-width: 460px; max-height: 90vh; overflow: auto; background: var(--bg); border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.sheet-head { position: sticky; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px; background: var(--bg); border-bottom: 1px solid var(--line); }
.sheet-head h2 { font-size: 16px; font-weight: 600; }
.sheet-head button { border: 0; background: none; color: var(--blue); font-weight: 500; padding: 4px 6px; }
.sheet-head button.strong { font-weight: 700; }
.sheet-head button:disabled { opacity: .4; }
.sheet-body { padding: 16px; display: flex; flex-direction: column; gap: 18px; }
.stepper { display: inline-flex; border-radius: 8px; background: var(--fill); }
.stepper button { border: 0; background: none; width: 34px; height: 30px; font-size: 18px; }
.confirm { display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; }
.confirm .row2 { display: flex; gap: 8px; }

.tabbar { display: none; }
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  main { padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px)); }
  .tabbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; justify-content: space-around;
    padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    background: var(--card); border-top: 1px solid var(--line); }
  .tabbar button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 500; color: var(--muted); padding: 4px 12px; }
  .tabbar svg { width: 24px; height: 24px; }
  .tabbar button[aria-current="page"] { color: var(--green); }
  .fab-wrap { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); right: calc(16px + env(safe-area-inset-right, 0px)); }
  .today, .prog, .settings { grid-template-columns: minmax(0, 1fr); }
  .topbar h1 { font-size: 28px; }
}
@media (max-width: 420px) {
  .summary-top { gap: 14px; }
  .ring { width: 128px; height: 128px; }
  .li input[type="text"] { width: 150px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="shell">
  <nav class="side" aria-label="Main">
    <div class="brand">
      <svg viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="7" fill="#22a454"/><circle cx="15" cy="15" r="8" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="3"/><path d="M15 7a8 8 0 1 1-7.6 10.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
      FitTrack
    </div>
    <button class="nav" data-tab="today"><svg><use href="#i-today"/></svg>Today</button>
    <button class="nav" data-tab="progress"><svg><use href="#i-progress"/></svg>Progress</button>
    <button class="nav" data-tab="prefs"><svg><use href="#i-gear"/></svg>Settings</button>
    <p class="side-note">Desktop preview of the iPhone app. Data stays in this browser.</p>
  </nav>
  <main>
    <div class="wrap" id="view"></div>
  </main>
</div>

<nav class="tabbar" aria-label="Main">
  <button data-tab="today"><svg><use href="#i-today"/></svg>Today</button>
  <button data-tab="progress"><svg><use href="#i-progress"/></svg>Progress</button>
  <button data-tab="prefs"><svg><use href="#i-gear"/></svg>Settings</button>
</nav>

  <div class="menu" id="addMenu" hidden role="menu">
    <button role="menuitem" disabled><svg><use href="#i-barcode"/></svg><span class="lbl">Scan Barcode<small>Needs the iPhone camera</small></span></button>
    <button role="menuitem" disabled><svg><use href="#i-camera"/></svg><span class="lbl">Snap Meal<small>Needs the iPhone camera</small></span></button>
    <button role="menuitem" id="menuManual"><svg><use href="#i-pencil"/></svg><span class="lbl">Manual Entry</span></button>
  </div>
  <button class="fab" id="fab" aria-label="Log food" aria-expanded="false" aria-controls="addMenu"><svg><use href="#i-plus"/></svg></button>
</div>

<div id="modalRoot"></div>

<script>
(() => {
  "use strict";

  // ---------- Model (mirrors FitTrack/Models) ----------
  const MEALS = [
    { id: "breakfast", title: "Breakfast", icon: "i-sunrise" },
    { id: "lunch", title: "Lunch", icon: "i-sun" },
    { id: "dinner", title: "Dinner", icon: "i-moon" },
    { id: "snack", title: "Snacks", icon: "i-carrot" },
  ];
  const SOURCE_ICON = { barcode: "i-barcode", photoAI: "i-sparkles", manual: "i-pencil", customFood: "i-star" };
  const MACROS = [
    { key: "p", title: "Protein", short: "P", color: "var(--blue)" },
    { key: "c", title: "Carbs", short: "C", color: "var(--orange)" },
    { key: "f", title: "Fat", short: "F", color: "var(--purple)" },
  ];
  const ACTIVITY = [
    { id: "sedentary", title: "Sedentary", detail: "Desk job, little or no exercise", mult: 1.2 },
    { id: "light", title: "Lightly Active", detail: "Light exercise 1–3 days a week", mult: 1.375 },
    { id: "moderate", title: "Moderately Active", detail: "Moderate exercise 3–5 days a week", mult: 1.55 },
    { id: "active", title: "Very Active", detail: "Hard exercise 6–7 days a week", mult: 1.725 },
    { id: "veryActive", title: "Extremely Active", detail: "Physical job or twice-daily training", mult: 1.9 },
  ];
  const GOALS = [
    { id: "lose", title: "Lose Weight", detail: "About 0.5 kg (1 lb) per week", adj: -500, ppk: 2.0 },
    { id: "maintain", title: "Maintain Weight", detail: "Stay where you are", adj: 0, ppk: 1.6 },
    { id: "gain", title: "Build Muscle", detail: "Lean surplus of ~300 kcal", adj: 300, ppk: 1.8 },
  ];
  const LB = 2.20462262, IN = 2.54;

  // Mifflin–St Jeor, same rules as NutritionCalculator.swift
  function plan(p) {
    const base = 10 * p.weightKg + 6.25 * p.heightCm - 5 * p.age;
    const bmr = p.sex === "male" ? base + 5 : base - 161;
    const act = ACTIVITY.find(a => a.id === p.activity) || ACTIVITY[2];
    const goal = GOALS.find(g => g.id === p.goal) || GOALS[1];
    const tdee = bmr * act.mult;
    const minimum = p.sex === "male" ? 1500 : 1200;
    const cal = Math.round(Math.max(minimum, tdee + goal.adj) / 10) * 10;
    let pr = Math.round(p.weightKg * goal.ppk);
    let fat = Math.round(Math.max(cal * 0.25 / 9, p.weightKg * 0.6));
    if (pr * 4 + fat * 9 > cal) {
      const s = cal * 0.9 / (pr * 4 + fat * 9);
      pr = Math.round(pr * s); fat = Math.round(fat * s);
    }
    const carbs = Math.round(Math.max(0, (cal - pr * 4 - fat * 9) / 4));
    return { bmr, tdee, targets: { cal, p: pr, c: carbs, f: fat } };
  }

  // ---------- Dates ----------
  const DAY = 86400000;
  const startOfDay = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const addDays = (t, n) => { const d = new Date(t); d.setDate(d.getDate() + n); return d.getTime(); };
  const sameDay = (a, b) => startOfDay(a) === startOfDay(b);
  const fmtDay = t => new Date(t).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
  const whole = n => Math.round(n || 0).toLocaleString("en-US");
  const one = n => (Math.round(n * 10) / 10).toLocaleString("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const uid = () => Math.random().toString(36).slice(2, 10);

  // ---------- Sample data ----------
  function seed() {
    let s = 20261120;
    const rnd = () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    const pick = arr => arr[Math.floor(rnd() * arr.length)];
    const F = {
      breakfast: [["Greek Yogurt", "Fage", 150, 15, 8, 6, "barcode"], ["Oatmeal with Berries", null, 310, 10, 54, 6, "manual"], ["Scrambled Eggs", null, 180, 12, 2, 14, "photoAI"], ["Banana", null, 105, 1.3, 27, 0.4, "manual"], ["Whole-Grain Toast", "Dave's Killer Bread", 160, 7, 28, 2, "barcode"]],
      lunch: [["Chicken Salad", null, 480, 42, 18, 26, "photoAI"], ["Turkey Wrap", null, 430, 30, 42, 14, "manual"], ["Salmon Rice Bowl", null, 620, 35, 70, 18, "photoAI"], ["Lentil Soup", "Amy's", 320, 18, 46, 7, "barcode"]],
      dinner: [["Spaghetti Bolognese", null, 650, 32, 78, 20, "photoAI"], ["Steak & Potatoes", null, 720, 52, 45, 34, "manual"], ["Chicken Stir-Fry", null, 540, 38, 55, 16, "photoAI"], ["Veggie Burrito", null, 590, 22, 82, 18, "manual"]],
      snack: [["Protein Bar", "Quest", 210, 20, 22, 7, "barcode"], ["Apple", null, 95, 0.5, 25, 0.3, "manual"], ["Almonds", null, 164, 6, 6, 14, "customFood"], ["Cottage Cheese", "Good Culture", 140, 19, 6, 4, "barcode"]],
    };
    const hours = { breakfast: 8, lunch: 12.5, dinner: 19, snack: 15.5 };
    const mk = (row, meal, day, qty = 1) => ({
      id: uid(), name: row[0], brand: row[1], meal, source: row[6],
      at: day + hours[meal] * 3600000 + Math.floor(rnd() * 40) * 60000,
      quantity: qty, unit: "serving", cal: row[2] * qty, p: row[3] * qty, c: row[4] * qty, f: row[5] * qty,
    });
    const today = startOfDay(Date.now());
    const entries = [
      mk(F.breakfast[0], "breakfast", today), mk(F.breakfast[3], "breakfast", today),
      mk(F.lunch[0], "lunch", today), mk(F.snack[0], "snack", today),
    ];
    for (let d = 1; d <= 89; d++) {
      if (rnd() < 0.14) continue; // unlogged day
      const day = addDays(today, -d);
      entries.push(mk(pick(F.breakfast), "breakfast", day));
      if (rnd() < 0.5) entries.push(mk(pick(F.breakfast), "breakfast", day));
      entries.push(mk(pick(F.lunch), "lunch", day, rnd() < 0.35 ? 1.5 : 1));
      entries.push(mk(pick(F.dinner), "dinner", day, rnd() < 0.25 ? 1.25 : 1));
      const snacks = 1 + Math.floor(rnd() * 3);
      for (let i = 0; i < snacks; i++) entries.push(mk(pick(F.snack), "snack", day));
    }
    const weights = [];
    for (let d = 88; d >= 0; d -= 3) {
      const kg = 70 + d * 0.026 + (rnd() - 0.5) * 0.6;
      weights.push({ id: uid(), at: addDays(today, -d) + 7 * 3600000, kg: Math.round(kg * 10) / 10 });
    }
    return {
      v: 1, sample: true,
      profile: { sex: "female", age: 30, heightCm: 170, weightKg: weights[weights.length - 1].kg, activity: "moderate", goal: "maintain", metric: true,
                 targets: { cal: 2000, p: 140, c: 220, f: 65 } },
      entries, weights,
    };
  }

  const KEY = "fittrack.desktop.v1";
  let db;
  try { db = JSON.parse(localStorage.getItem(KEY) || "null"); } catch { db = null; }
  if (!db || db.v !== 1) db = seed();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch {} };

  // ---------- UI state ----------
  const ui = { tab: "today", date: startOfDay(Date.now()), range: 7, closed: new Set(), recalc: false, confirmWipe: false };
  try { const t = localStorage.getItem(KEY + ".tab"); if (["today", "progress", "prefs"].includes(t)) ui.tab = t; } catch {}

  const view = document.getElementById("view");
  const sum = list => list.reduce((a, e) => ({ cal: a.cal + e.cal, p: a.p + e.p, c: a.c + e.c, f: a.f + e.f }), { cal: 0, p: 0, c: 0, f: 0 });
  const entriesOn = day => db.entries.filter(e => sameDay(e.at, day)).sort((a, b) => a.at - b.at);
  const T = () => db.profile.targets;

  const banner = () => `<div class="banner"><svg><use href="#i-info"/></svg><span>This is a desktop preview. Barcode scanning, meal photos and Apple Health need the iPhone app.${db.sample ? " It opens with sample data; your changes are saved in this browser." : " Your changes are saved in this browser."}</span></div>`;
  const macroInline = n => `<span class="macros-inline num">${MACROS.map(m => `<span><i style="color:${m.color}">${m.short}</i> ${whole(n[m.key])}</span>`).join("")}</span>`;

  function render() {
    document.querySelectorAll("[data-tab]").forEach(b => b.toggleAttribute("aria-current", false));
    document.querySelectorAll(`[data-tab="${ui.tab}"]`).forEach(b => b.setAttribute("aria-current", "page"));
    document.getElementById("fabWrap").hidden = ui.tab !== "today";
    if (ui.tab === "today") renderToday();
    else if (ui.tab === "progress") renderProgress();
    else renderPrefs();
  }

  // ---------- Today ----------
  function ringSVG(progress) {
    const r = 62, C = 2 * Math.PI * r, v = Math.max(0, progress || 0);
    const lap1 = Math.min(v, 1), lap2 = Math.min(Math.max(v - 1, 0), 1);
    return `<svg viewBox="0 0 150 150" aria-hidden="true">
      <circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--green-soft)" stroke-width="16"/>
      <circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--green)" stroke-width="16" stroke-linecap="round" stroke-dasharray="${lap1 * C} ${C}"/>
      ${lap2 > 0 ? `<circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--orange)" stroke-width="16" stroke-linecap="round" stroke-dasharray="${lap2 * C} ${C}"/>` : ""}
    </svg>`;
  }
  function gaugeSVG(m, eaten, target) {
    const r = 24, C = 2 * Math.PI * r, frac = Math.min(eaten / Math.max(target, 1), 1);
    const color = eaten > target * 1.1 ? "var(--orange)" : m.color;
    return `<svg viewBox="0 0 58 58" aria-hidden="true">
      <circle cx="29" cy="29" r="${r}" fill="none" stroke="var(--fill)" stroke-width="6"/>
      <circle cx="29" cy="29" r="${r}" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${frac * C} ${C}" transform="rotate(-90 29 29)"/>
      <text x="29" y="33" text-anchor="middle" font-size="13" font-weight="600" fill="var(--fg)" class="num">${whole(eaten)}</text>
    </svg>`;
  }

  function renderToday() {
    const isToday = sameDay(ui.date, Date.now());
    const title = isToday ? "Today" : sameDay(ui.date, addDays(Date.now(), -1)) ? "Yesterday" : fmtDay(ui.date);
    const list = entriesOn(ui.date), eaten = sum(list), t = T();
    const remaining = t.cal - eaten.cal;
    view.innerHTML = `
      ${banner()}
      <div class="topbar">
        <h1>${esc(title)}</h1>
        ${isToday ? "" : `<button class="btn" data-act="today">Today</button>`}
        <button class="btn icon" data-act="prev" aria-label="Previous day"><svg><use href="#i-left"/></svg></button>
        <button class="btn icon" data-act="next" aria-label="Next day" ${isToday ? "disabled" : ""}><svg><use href="#i-right"/></svg></button>
      </div>
      <div class="today">
        <section class="card summary" aria-label="Daily summary">
          <div class="summary-top">
            <div class="ring" role="img" aria-label="${whole(eaten.cal)} of ${whole(t.cal)} kilocalories eaten">
              ${ringSVG(t.cal > 0 ? eaten.cal / t.cal : 0)}
              <div class="ring-label"><b class="num">${whole(Math.abs(remaining))}</b><span class="${remaining < 0 ? "over" : ""}">${remaining >= 0 ? "kcal left" : "kcal over"}</span></div>
            </div>
            <div class="stats">
              <div class="stat"><svg style="color:var(--muted)"><use href="#i-flag"/></svg><div><small>Goal</small><b class="num">${whole(t.cal)} kcal</b></div></div>
              <div class="stat"><svg style="color:var(--green)"><use href="#i-fork"/></svg><div><small>Eaten</small><b class="num">${whole(eaten.cal)} kcal</b></div></div>
            </div>
          </div>
          <div class="gauges">
            ${MACROS.map(m => `<div class="gauge">${gaugeSVG(m, eaten[m.key], t[m.key])}<div class="t">${m.title}</div><div class="v num">${whole(eaten[m.key])} / ${whole(t[m.key])} g</div></div>`).join("")}
          </div>
        </section>
        <div class="meals">
          ${MEALS.map(meal => {
            const rows = list.filter(e => e.meal === meal.id);
            const open = !ui.closed.has(meal.id);
            return `<section class="card meal" data-open="${open}">
              <button class="meal-head" data-act="toggle" data-meal="${meal.id}" aria-expanded="${open}">
                <svg class="mi"><use href="#${meal.icon}"/></svg><h3>${meal.title}</h3>
                <span class="muted num">${whole(sum(rows).cal)} kcal</span><svg class="chev"><use href="#i-chev"/></svg>
              </button>
              <div class="rows">
                ${rows.length ? rows.map(e => `
                  <button class="row" data-act="edit" data-id="${e.id}" title="Edit entry">
                    <svg class="src"><use href="#${SOURCE_ICON[e.source] || "i-pencil"}"/></svg>
                    <span class="name"><div>${esc(e.name)}</div><small>${esc([e.brand, portion(e)].filter(Boolean).join(" · "))}</small></span>
                    <span class="kcal"><b class="num">${whole(e.cal)} kcal</b>${macroInline(e)}</span>
                  </button>`).join("") : `<div class="empty-row">Nothing logged yet</div>`}
              </div>
            </section>`;
          }).join("")}
        </div>
      </div>`;
  }
  const portion = e => {
    const amt = Math.round(e.quantity * 100) / 100;
    return e.unit === "g" ? `${amt} g` : `${amt} × ${e.unit}`;
  };

  // ---------- Progress ----------
  function dailyIntake() {
    const start = addDays(startOfDay(Date.now()), -(ui.range - 1));
    const days = [];
    for (let i = 0; i < ui.range; i++) {
      const day = addDays(start, i), list = entriesOn(day);
      days.push({ day, n: sum(list), count: list.length });
    }
    return { start, days };
  }
  function renderProgress() {
    const { start, days } = dailyIntake(), t = T();
    const logged = days.filter(d => d.count > 0);
    const avg = logged.length ? logged.reduce((a, d) => a + d.n.cal, 0) / logged.length : 0;
    const onTarget = logged.filter(d => Math.abs(d.n.cal - t.cal) <= t.cal * 0.1).length;
    const avgN = logged.length ? MACROS.reduce((o, m) => (o[m.key] = logged.reduce((a, d) => a + d.n[m.key], 0) / logged.length, o), {}) : { p: 0, c: 0, f: 0 };
    const axisMax = Math.max(1, ...MACROS.flatMap(m => [avgN[m.key], t[m.key]])) * 1.15;
    const pts = db.weights.filter(w => w.at >= start).sort((a, b) => a.at - b.at);
    const metric = db.profile.metric, wu = metric ? "kg" : "lb", disp = kg => metric ? kg : kg * LB;
    let wsub = "No weigh-ins in this period";
    if (pts.length) {
      const delta = disp(pts[pts.length - 1].kg) - disp(pts[0].kg);
      wsub = `${one(disp(pts[pts.length - 1].kg))} ${wu} · ${delta > 0 ? "+" : ""}${one(delta)} ${wu}`;
    }
    view.innerHTML = `
      ${banner()}
      <div class="topbar">
        <h1>Progress</h1>
        <div class="seg" role="group" aria-label="Range">
          ${[[7, "7D"], [30, "30D"], [90, "90D"]].map(([v, l]) => `<button data-act="range" data-v="${v}" aria-pressed="${ui.range === v}">${l}</button>`).join("")}
        </div>
        <button class="btn" data-act="logweight"><svg><use href="#i-scale"/></svg>Log Weight</button>
      </div>
      <div class="prog">
        <section class="card wide">
          <h2>Calorie Intake</h2>
          <div class="sub">${logged.length ? `Average ${whole(avg)} kcal/day` : "No meals logged in this period"}</div>
          <div class="chart" id="calChart"></div>
          <div class="tiles">
            <div class="tile"><small>Days Logged</small><b class="num">${logged.length}/${ui.range}</b></div>
            <div class="tile"><small>Within ±10%</small><b class="num">${onTarget}</b></div>
            <div class="tile"><small>Goal</small><b class="num">${whole(t.cal)} kcal</b></div>
          </div>
        </section>
        <section class="card">
          <h2>Average Macros</h2>
          <div class="sub">Per logged day vs. target (tick)</div>
          <div class="mbars">
            ${MACROS.map(m => `<div class="mbar"><span>${m.title}</span>
              <div class="track"><div class="fill" style="width:${avgN[m.key] / axisMax * 100}%;background:${m.color}"></div><div class="tick" style="left:calc(${t[m.key] / axisMax * 100}% - 1.5px)"></div></div>
              <span class="val num">${whole(avgN[m.key])} / ${whole(t[m.key])} g</span></div>`).join("")}
          </div>
        </section>
        <section class="card">
          <h2>Body Weight</h2>
          <div class="sub num">${wsub}</div>
          ${pts.length ? `<div class="chart" id="wChart"></div>` : `<div style="padding:24px 0;text-align:center"><button class="btn" data-act="logweight">Log Your Weight</button></div>`}
        </section>
      </div>`;
    drawCalories(days, t.cal);
    if (pts.length) drawWeight(pts, start, disp, wu);
  }

  function niceStep(max) {
    for (const s of [250, 500, 1000, 2000]) if (max / s <= 5) return s;
    return 5000;
  }
  function drawCalories(days, target) {
    const box = document.getElementById("calChart"); if (!box) return;
    const W = Math.max(260, box.clientWidth), H = 230, L = 44, R = 8, Tp = 18, B = 24;
    const max = Math.max(target * 1.25, ...days.map(d => d.n.cal * 1.08));
    const step = niceStep(max), top = Math.ceil(max / step) * step;
    const y = v => Tp + (H - Tp - B) * (1 - v / top);
    const bw = (W - L - R) / days.length, gap = days.length > 40 ? 1 : days.length > 10 ? 3 : 10;
    let g = "";
    for (let v = 0; v <= top; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${whole(v)}</text>`;
    days.forEach((d, i) => {
      const x = L + i * bw + gap / 2, w = Math.max(1, bw - gap), h = y(0) - y(d.n.cal);
      const fill = d.n.cal > target * 1.1 ? "var(--orange)" : "var(--green)";
      if (d.n.cal > 0) g += `<rect x="${x}" y="${y(d.n.cal)}" width="${w}" height="${h}" rx="${days.length > 40 ? 1 : 4}" fill="${fill}" data-i="${i}" class="bar"/>`;
      const date = new Date(d.day);
      const showLabel = days.length === 7 || (days.length === 30 ? i % 7 === 0 : i % 15 === 0);
      if (showLabel) {
        const label = days.length === 7 ? date.toLocaleDateString("en-US", { weekday: "short" }) : `${date.getMonth() + 1}/${date.getDate()}`;
        g += `<text x="${days.length === 7 ? x + w / 2 : x}" y="${H - 6}" text-anchor="${days.length === 7 ? "middle" : "start"}">${label}</text>`;
      }
      g += `<rect x="${L + i * bw}" y="${Tp}" width="${bw}" height="${H - Tp - B}" fill="transparent" data-hit="${i}"/>`;
    });
    g += `<line x1="${L}" x2="${W - R}" y1="${y(target)}" y2="${y(target)}" stroke="var(--muted)" stroke-dasharray="5 4"/>
          <text x="${L + 4}" y="${y(target) - 5}">Goal ${whole(target)}</text>`;
    box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Daily calorie intake chart">${g}</svg><div class="tip" hidden></div>`;
    const tip = box.querySelector(".tip"), svg = box.querySelector("svg");
    svg.addEventListener("mousemove", ev => {
      const i = ev.target.dataset.hit ?? ev.target.dataset.i;
      if (i === undefined) { tip.hidden = true; return; }
      const d = days[+i];
      tip.innerHTML = `<span class="muted">${fmtDay(d.day)}</span><b class="num">${whole(d.n.cal)} kcal</b>${macroInline(d.n)}`;
      tip.hidden = false;
      const rect = box.getBoundingClientRect();
      let x = ev.clientX - rect.left + 12;
      if (x + tip.offsetWidth > rect.width) x = ev.clientX - rect.left - tip.offsetWidth - 12;
      tip.style.left = Math.max(0, x) + "px"; tip.style.top = "0px";
      svg.querySelectorAll(".bar").forEach(b => b.style.opacity = b.dataset.i === i ? 1 : .4);
    });
    svg.addEventListener("mouseleave", () => { tip.hidden = true; svg.querySelectorAll(".bar").forEach(b => b.style.opacity = 1); });
  }
  function drawWeight(pts, start, disp, unit) {
    const box = document.getElementById("wChart"); if (!box) return;
    const W = Math.max(240, box.clientWidth), H = 200, L = 40, R = 10, Tp = 12, B = 22;
    const vals = pts.map(p => disp(p.kg));
    const lo = Math.floor(Math.min(...vals) - 1), hi = Math.ceil(Math.max(...vals) + 1);
    const now = Date.now();
    const x = t => L + (W - L - R) * (t - start) / Math.max(1, now - start);
    const y = v => Tp + (H - Tp - B) * (1 - (v - lo) / (hi - lo));
    const stepY = Math.max(1, Math.ceil((hi - lo) / 4));
    let g = "";
    for (let v = lo; v <= hi; v += stepY) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
    const d = pts.map((p, i) => `${i ? "L" : "M"}${x(p.at).toFixed(1)},${y(disp(p.kg)).toFixed(1)}`).join("");
    g += `<path d="${d}" fill="none" stroke="var(--indigo)" stroke-width="2.2" stroke-linejoin="round"/>`;
    pts.forEach((p, i) => { g += `<circle cx="${x(p.at)}" cy="${y(disp(p.kg))}" r="${i === pts.length - 1 ? 4.5 : pts.length > 30 ? 2 : 3}" fill="var(--indigo)"><title>${fmtDay(p.at)}: ${one(disp(p.kg))} ${unit}</title></circle>`; });
    g += `<text x="${L}" y="${H - 5}">${fmtDay(start)}</text><text x="${W - R}" y="${H - 5}" text-anchor="end">Today</text>`;
    box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Body weight chart">${g}</svg>`;
  }

  // ---------- Settings ----------
  function renderPrefs() {
    const t = T(), pr = db.profile;
    const macroCal = t.p * 4 + t.c * 4 + t.f * 9, diff = macroCal - t.cal;
    const metric = pr.metric;
    const pl = plan(pr);
    const target = (k, label, unit) => `<div class="li"><label for="t-${k}">${label}</label><input class="num" type="number" min="0" step="1" id="t-${k}" data-target="${k}" value="${Math.round(t[k])}"><span class="unit">${unit}</span></div>`;
    view.innerHTML = `
      ${banner()}
      <div class="topbar"><h1>Settings</h1></div>
      <div class="settings">
        <div class="group">
          <div class="section-label">Daily Targets</div>
          <div class="list">
            ${target("cal", "Calories", "kcal")}${target("p", "Protein", "g")}${target("c", "Carbs", "g")}${target("f", "Fat", "g")}
            <div class="li"><button class="link" data-act="recalc">${ui.recalc ? "Hide Profile" : "Recalculate from Profile…"}</button></div>
          </div>
          <div class="foot ${Math.abs(diff) > 50 ? "warn" : ""}" id="macroFoot">${Math.abs(diff) > 50
            ? `Your macros add up to ${whole(macroCal)} kcal, ${whole(Math.abs(diff))} kcal ${diff > 0 ? "over" : "under"} your calorie target.`
            : `Macros add up to ${whole(macroCal)} kcal.`}</div>
        </div>
        ${ui.recalc ? `
        <div class="group">
          <div class="section-label">About You</div>
          <div class="list">
            <div class="li"><label for="p-sex">Sex</label><select id="p-sex" data-prof="sex"><option value="female" ${pr.sex === "female" ? "selected" : ""}>Female</option><option value="male" ${pr.sex === "male" ? "selected" : ""}>Male</option></select></div>
            <div class="li"><label for="p-age">Age</label><input class="num" type="number" id="p-age" data-prof="age" min="13" max="110" value="${pr.age}"><span class="unit">yr</span></div>
            <div class="li"><label for="p-h">Height</label><input class="num" type="number" id="p-h" data-prof="height" step="${metric ? 1 : 0.5}" value="${metric ? Math.round(pr.heightCm) : Math.round(pr.heightCm / IN * 2) / 2}"><span class="unit">${metric ? "cm" : "in"}</span></div>
            <div class="li"><label for="p-w">Weight</label><input class="num" type="number" id="p-w" data-prof="weight" step="0.1" value="${one(metric ? pr.weightKg : pr.weightKg * LB).replace(/,/g, "")}"><span class="unit">${metric ? "kg" : "lb"}</span></div>
          </div>
          <div class="section-label" style="margin-top:12px">Activity Level</div>
          <div class="list choices">${ACTIVITY.map(a => `<button class="choice" data-act="activity" data-v="${a.id}" aria-pressed="${pr.activity === a.id}"><span class="dot"></span><span>${a.title}<small>${a.detail}</small></span></button>`).join("")}</div>
          <div class="section-label" style="margin-top:12px">Your Goal</div>
          <div class="list choices">${GOALS.map(g => `<button class="choice" data-act="goal" data-v="${g.id}" aria-pressed="${pr.goal === g.id}"><span class="dot"></span><span>${g.title}<small>${g.detail}</small></span></button>`).join("")}</div>
          <div class="section-label" style="margin-top:12px">Your Plan</div>
          <div class="list">
            <div class="plan">
              <div><small>Resting (BMR)</small><b class="num">${whole(pl.bmr)}</b></div>
              <div><small>Maintenance</small><b class="num">${whole(pl.tdee)}</b></div>
              <div><small>Daily Target</small><b class="num" style="color:var(--green)">${whole(pl.targets.cal)}</b></div>
            </div>
            <div class="li"><span class="lab">${MACROS.map(m => `<span style="color:${m.color};font-weight:600">${m.title}</span> ${pl.targets[m.key]} g`).join(" · ")}</span></div>
            <div class="li"><button class="link" data-act="applyplan">Use This Plan</button></div>
          </div>
          <div class="foot">Mifflin–St Jeor estimate, the same formula the iPhone app uses.</div>
        </div>` : ""}
        <div class="group">
          <div class="section-label">Units</div>
          <div class="list"><div class="li"><span class="lab">Measurement System</span>
            <div class="seg" role="group" aria-label="Measurement system"><button data-act="units" data-v="metric" aria-pressed="${metric}">Metric</button><button data-act="units" data-v="imperial" aria-pressed="${!metric}">Imperial</button></div></div></div>
        </div>
        <div class="group">
          <div class="section-label">Data</div>
          <div class="list">
            ${ui.confirmWipe ? `<div class="confirm"><span>Delete all food logs? This can't be undone.</span><div class="row2"><button class="btn danger" data-act="wipe">Delete All</button><button class="btn" data-act="cancelwipe">Cancel</button></div></div>`
              : `<div class="li"><button class="link danger" data-act="askwipe">Delete All Food Logs</button></div>`}
            <div class="li"><button class="link" data-act="reset">Restore Sample Data</button></div>
          </div>
          <div class="foot">Data in this preview is stored only in this browser and isn't shared with the iPhone app.</div>
        </div>
        <div class="group">
          <div class="section-label">Not Available on Desktop</div>
          <div class="list">
            <div class="li"><span class="lab">Apple Health sync</span><span class="muted">iPhone only</span></div>
            <div class="li"><span class="lab">Barcode scanner</span><span class="muted">iPhone only</span></div>
            <div class="li"><span class="lab">AI photo estimates</span><span class="muted">iPhone only</span></div>
          </div>
        </div>
      </div>`;
  }

  // ---------- Modals ----------
  const modalRoot = document.getElementById("modalRoot");
  let lastFocus = null;
  function openModal(html, onMount) {
    lastFocus = document.activeElement;
    modalRoot.innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
    onMount?.(modalRoot.querySelector(".sheet"));
    modalRoot.querySelector("input, select, button")?.focus();
  }
  function closeModal() { modalRoot.innerHTML = ""; lastFocus?.focus?.(); }
  modalRoot.addEventListener("click", e => { if (e.target.dataset.act === "scrim") closeModal(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") { if (modalRoot.innerHTML) closeModal(); else toggleMenu(false); } });

  const mealOptions = sel => MEALS.map(m => `<option value="${m.id}" ${m.id === sel ? "selected" : ""}>${m.title}</option>`).join("");
  const localInput = t => { const d = new Date(t); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };

  function editEntry(id) {
    const e = db.entries.find(x => x.id === id); if (!e) return;
    const isG = e.unit === "g", step = isG ? 5 : 0.25;
    let qty = e.quantity, confirming = false;
    const facts = () => {
      const f = e.quantity > 0 ? qty / e.quantity : 1;
      return `<div class="li"><span class="lab">Calories</span><b class="num">${whole(e.cal * f)} kcal</b></div>` +
        MACROS.map(m => `<div class="li"><span class="lab"><span style="color:${m.color}">●</span> ${m.title}</span><span class="num">${one(e[m.key] * f)} g</span></div>`).join("");
    };
    openModal(`
      <div class="sheet-head"><button data-m="cancel">Cancel</button><h2>Edit Entry</h2><button class="strong" data-m="save">Save</button></div>
      <div class="sheet-body">
        <div class="list"><div class="li"><span class="lab"><b>${esc(e.name)}</b>${e.brand ? `<br><small class="muted">${esc(e.brand)}</small>` : ""}</span></div></div>
        <div class="group"><div class="section-label">Portion</div><div class="list"><div class="li">
          <label for="m-qty">${isG ? "Grams" : "× " + esc(e.unit)}</label>
          <input class="num" type="number" id="m-qty" min="${step}" step="${step}" value="${qty}">
          <span class="stepper"><button data-m="dec" aria-label="Decrease">−</button><button data-m="inc" aria-label="Increase">+</button></span>
        </div></div></div>
        <div class="group"><div class="section-label">Nutrition</div><div class="list" id="m-facts">${facts()}</div></div>
        <div class="list">
          <div class="li"><label for="m-meal">Meal</label><select id="m-meal">${mealOptions(e.meal)}</select></div>
          <div class="li"><label for="m-time">Time</label><input type="datetime-local" id="m-time" value="${localInput(e.at)}" style="width:210px"></div>
        </div>
        <div class="list" id="m-del"><div class="li"><button class="link danger" data-m="askdel">Delete Entry</button></div></div>
      </div>`, sheet => {
      const q = sheet.querySelector("#m-qty");
      const upd = () => { sheet.querySelector("#m-facts").innerHTML = facts(); sheet.querySelector('[data-m="save"]').disabled = !(qty > 0); };
      q.addEventListener("input", () => { qty = parseFloat(q.value) || 0; upd(); });
      sheet.addEventListener("click", ev => {
        const a = ev.target.closest("[data-m]")?.dataset.m; if (!a) return;
        if (a === "cancel") closeModal();
        if (a === "inc" || a === "dec") { qty = Math.max(step, Math.round((qty + (a === "inc" ? step : -step)) * 100) / 100); q.value = qty; upd(); }
        if (a === "askdel") sheet.querySelector("#m-del").innerHTML = `<div class="confirm"><span>Delete this entry?</span><div class="row2"><button class="btn danger" data-m="del">Delete</button><button class="btn" data-m="nodel">Cancel</button></div></div>`;
        if (a === "nodel") sheet.querySelector("#m-del").innerHTML = `<div class="li"><button class="link danger" data-m="askdel">Delete Entry</button></div>`;
        if (a === "del") { db.entries = db.entries.filter(x => x.id !== id); save(); closeModal(); render(); }
        if (a === "save" && qty > 0) {
          const f = qty / e.quantity;
          ["cal", "p", "c", "f"].forEach(k => e[k] *= f);
          if (e.grams) e.grams *= f;
          e.quantity = qty;
          e.meal = sheet.querySelector("#m-meal").value;
          const t = new Date(sheet.querySelector("#m-time").value).getTime();
          if (!isNaN(t)) e.at = t;
          save(); closeModal(); render();
        }
      });
    });
  }

  function suggestedMeal(h) { return h >= 4 && h < 11 ? "breakfast" : h >= 11 && h < 15 ? "lunch" : h >= 17 && h < 22 ? "dinner" : "snack"; }
  function manualEntry() {
    const meal = suggestedMeal(new Date().getHours());
    const num = (id, label, unit, step = "any") => `<div class="li"><label for="${id}">${label}</label><input class="num" type="number" min="0" step="${step}" id="${id}" placeholder="0"><span class="unit">${unit}</span></div>`;
    openModal(`
      <div class="sheet-head"><button data-m="cancel">Cancel</button><h2>Manual Entry</h2><button class="strong" data-m="add" disabled>Add</button></div>
      <form class="sheet-body" id="mform" novalidate>
        <div class="group"><div class="section-label">Food</div><div class="list">
          <div class="li"><input type="text" id="f-name" placeholder="Name (required)" style="width:100%" aria-label="Name"></div>
          <div class="li"><input type="text" id="f-brand" placeholder="Brand" style="width:100%" aria-label="Brand"></div>
        </div></div>
        <div class="group"><div class="section-label">Serving</div><div class="list">
          <div class="li"><label for="f-serv">Serving</label><input type="text" id="f-serv" value="serving" placeholder="e.g. 1 cup, 1 bar" style="width:160px"></div>
          ${num("f-grams", "Serving Weight", "g")}
          <div class="li"><label for="f-qty">Servings Eaten</label><input class="num" type="number" id="f-qty" min="0.25" step="0.25" value="1"></div>
        </div></div>
        <div class="group"><div class="section-label">Nutrition per Serving</div><div class="list">
          ${num("f-cal", "Calories", "kcal", "1")}${num("f-p", "Protein", "g")}${num("f-c", "Carbs", "g")}${num("f-f", "Fat", "g")}
        </div><div class="foot" id="f-total"></div></div>
        <div class="list"><div class="li"><label for="f-meal">Meal</label><select id="f-meal">${mealOptions(meal)}</select></div></div>
      </form>`, sheet => {
      const v = id => parseFloat(sheet.querySelector("#" + id).value);
      const valid = () => sheet.querySelector("#f-name").value.trim() && v("f-cal") >= 0 && v("f-qty") > 0;
      const upd = () => {
        sheet.querySelector('[data-m="add"]').disabled = !valid();
        const q = v("f-qty"), c = v("f-cal");
        sheet.querySelector("#f-total").textContent = q > 0 && q !== 1 && c >= 0 ? `Total: ${whole(c * q)} kcal for ${q} servings` : "";
      };
      sheet.addEventListener("input", upd);
      const add = () => {
        if (!valid()) return;
        const q = v("f-qty"), n = k => (isNaN(v(k)) ? 0 : Math.max(0, v(k))) * q;
        const now = new Date(), at = new Date(ui.date);
        at.setHours(now.getHours(), now.getMinutes());
        const grams = v("f-grams");
        db.entries.push({ id: uid(), name: sheet.querySelector("#f-name").value.trim(), brand: sheet.querySelector("#f-brand").value.trim() || null,
          meal: sheet.querySelector("#f-meal").value, source: "manual", at: at.getTime(), quantity: q,
          unit: sheet.querySelector("#f-serv").value.trim() || "serving", grams: grams > 0 ? grams * q : null,
          cal: n("f-cal"), p: n("f-p"), c: n("f-c"), f: n("f-f") });
        save(); closeModal(); render();
      };
      sheet.querySelector("#mform").addEventListener("submit", ev => { ev.preventDefault(); add(); });
      sheet.addEventListener("click", ev => {
        const a = ev.target.closest("[data-m]")?.dataset.m;
        if (a === "cancel") closeModal();
        if (a === "add") add();
      });
    });
  }

  function logWeight() {
    const metric = db.profile.metric;
    const cur = metric ? db.profile.weightKg : db.profile.weightKg * LB;
    openModal(`
      <div class="sheet-head"><button data-m="cancel">Cancel</button><h2>Log Weight</h2><button class="strong" data-m="save">Save</button></div>
      <div class="sheet-body"><div class="list">
        <div class="li"><label for="w-val">Weight</label><input class="num" type="number" id="w-val" step="0.1" min="0" value="${Math.round(cur * 10) / 10}"><span class="unit">${metric ? "kg" : "lb"}</span></div>
        <div class="li"><label for="w-date">Date</label><input type="date" id="w-date" value="${localInput(Date.now()).slice(0, 10)}" max="${localInput(Date.now()).slice(0, 10)}" style="width:170px"></div>
      </div></div>`, sheet => {
      sheet.addEventListener("click", ev => {
        const a = ev.target.closest("[data-m]")?.dataset.m;
        if (a === "cancel") closeModal();
        if (a === "save") {
          const val = parseFloat(sheet.querySelector("#w-val").value);
          if (!(val > 0)) return;
          const [Y, M, D] = sheet.querySelector("#w-date").value.split("-").map(Number);
          const at = new Date(Y, (M || 1) - 1, D || 1, 8).getTime();
          const kg = metric ? val : val / LB;
          const latest = Math.max(0, ...db.weights.map(w => w.at));
          db.weights.push({ id: uid(), at, kg });
          if (at >= latest) db.profile.weightKg = kg;
          save(); closeModal(); render();
        }
      });
    });
  }

  // ---------- Events ----------
  const fab = document.getElementById("fab"), menu = document.getElementById("addMenu");
  function toggleMenu(open = menu.hidden) { menu.hidden = !open; fab.setAttribute("aria-expanded", String(open)); }
  fab.addEventListener("click", () => toggleMenu());
  document.getElementById("menuManual").addEventListener("click", () => { toggleMenu(false); manualEntry(); });
  document.addEventListener("click", e => { if (!menu.hidden && !e.target.closest("#fabWrap")) toggleMenu(false); });

  document.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => {
    ui.tab = b.dataset.tab; try { localStorage.setItem(KEY + ".tab", ui.tab); } catch {}
    render(); window.scrollTo(0, 0);
  }));

  view.addEventListener("click", e => {
    const el = e.target.closest("[data-act]"); if (!el) return;
    const a = el.dataset.act;
    if (a === "prev") ui.date = addDays(ui.date, -1);
    else if (a === "next") ui.date = Math.min(addDays(ui.date, 1), startOfDay(Date.now()));
    else if (a === "today") ui.date = startOfDay(Date.now());
    else if (a === "toggle") { const m = el.dataset.meal; ui.closed.has(m) ? ui.closed.delete(m) : ui.closed.add(m); }
    else if (a === "edit") return editEntry(el.dataset.id);
    else if (a === "range") ui.range = +el.dataset.v;
    else if (a === "logweight") return logWeight();
    else if (a === "recalc") ui.recalc = !ui.recalc;
    else if (a === "activity") { db.profile.activity = el.dataset.v; save(); }
    else if (a === "goal") { db.profile.goal = el.dataset.v; save(); }
    else if (a === "applyplan") { db.profile.targets = { ...plan(db.profile).targets }; save(); ui.recalc = false; }
    else if (a === "units") { db.profile.metric = el.dataset.v === "metric"; save(); }
    else if (a === "askwipe") ui.confirmWipe = true;
    else if (a === "cancelwipe") ui.confirmWipe = false;
    else if (a === "wipe") { db.entries = []; db.sample = false; save(); ui.confirmWipe = false; }
    else if (a === "reset") { db = seed(); save(); }
    else return;
    render();
  });

  view.addEventListener("change", e => {
    const el = e.target;
    if (el.dataset.target) {
      const v = parseFloat(el.value);
      if (v >= 0) { db.profile.targets[el.dataset.target] = Math.round(v); save(); }
      render();
    } else if (el.dataset.prof) {
      const v = el.dataset.prof === "sex" ? el.value : parseFloat(el.value), p = db.profile, metric = p.metric;
      if (el.dataset.prof === "sex") p.sex = v;
      else if (!(v > 0)) return render();
      else if (el.dataset.prof === "age") p.age = Math.min(110, Math.max(13, Math.round(v)));
      else if (el.dataset.prof === "height") p.heightCm = metric ? v : v * IN;
      else if (el.dataset.prof === "weight") p.weightKg = metric ? v : v / LB;
      save(); render();
    }
  });

  let rt;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (ui.tab === "progress") renderProgress(); }, 120); });

  render();
})();
</script>
