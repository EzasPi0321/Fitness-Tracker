# XcodeGen spec — run `xcodegen generate` in this folder to produce FitTrack.xcodeproj
name: FitTrack
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # set your Team ID
targets:
  FitTrack:
    type: application
    platform: iOS
    sources:
      - path: FitTrack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.fittrack
        INFOPLIST_FILE: FitTrack/Info.plist
        CODE_SIGN_ENTITLEMENTS: FitTrack/FitTrack.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  FitTrackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FitTrackTests
    dependencies:
      - target: FitTrack
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.fittrack.tests
schemes:
  FitTrack:
    build:
      targets:
        FitTrack: all
        FitTrackTests: [test]
    test:
      targets:
        - FitTrackTests
